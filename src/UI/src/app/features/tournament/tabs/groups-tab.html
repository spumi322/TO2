@if (!seeded()) {
  <app-empty-state
    title="Groups are not drawn yet"
    message="The groups are drawn when the tournament starts."
    icon="pi-th-large"
  />
} @else {
  <div class="groups" [class.single]="single()">
    @for (group of store.groups(); track group.id) {
      <section class="card group">
        <div class="group-head">
          <h3>{{ group.name }}</h3>
          <span class="spacer"></span>
          @if (group.isFinished) {
            <span class="done small"><i class="pi pi-check"></i> Finished</span>
          } @else {
            <span class="muted small num">{{ played(group) }} / {{ group.matches.length }} played</span>
          }
        </div>
        <div class="group-body">
          <app-group-table [group]="group" [advancing]="advancing()" />
          <div class="matches" [attr.aria-label]="group.name + ' matches'">
            @for (match of sortedMatches(group.matches); track match.id) {
              <app-match-card
                [match]="match"
                [teamNames]="store.teamNames()"
                [canScore]="canScore()"
                [busy]="scoring.savingMatchId() === match.id"
                (gameWinner)="scoring.setWinner($event)"
              />
            }
          </div>
        </div>
      </section>
    }
  </div>
}
