<div class="page-narrow">
  <form class="card stack auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>

    @if (error(); as message) {
      <div class="form-error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="email">Email</label>
      <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input pInputText id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Enter your password.</span>
      }
    </div>

    <p-button type="submit" label="Sign in" [loading]="submitting()" [fluid]="true" />

    <p class="muted switch">
      No account yet? <a routerLink="/register">Create one</a>
    </p>
  </form>
</div>
